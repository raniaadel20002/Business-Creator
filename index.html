    <style>
      body {
        font-family: "Inter", "Tajawal", sans-serif;
        background-color: #faf9f6;
        color: #1a1a1a;
        font-size: 14px;
        line-height: 1.5;
      }
      @media (min-width: 640px) {
        body {
          font-size: 16px;
        }
      }

      /* Premium Eye-Friendly focus-enhancing company grid background */
      .bg-grid-canvas {
        background-color: #faf9f6 !important;
        background-image: 
          radial-gradient(circle at 50% 50%, rgba(250, 249, 246, 0) 40%, rgba(250, 249, 246, 0.8) 100%),
          linear-gradient(rgba(255, 122, 0, 0.02) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 122, 0, 0.02) 1px, transparent 1px),
          linear-gradient(rgba(146, 102, 230, 0.012) 1.5px, transparent 1.5px),
          linear-gradient(90deg, rgba(146, 102, 230, 0.012) 1.5px, transparent 1.5px);
        background-size: 100% 100%, 32px 32px, 32px 32px, 160px 160px, 160px 160px;
        background-attachment: fixed;
      }

      /* Subtle Gradients */
      .bg-gradient-subtle-gray {
        background: linear-gradient(135deg, #f8f8f8 0%, #ffffff 100%);
      }
      .bg-gradient-subtle-purple {
        background: linear-gradient(
          135deg,
          #ffffff 0%,
          rgba(146, 102, 230, 0.03) 100%
        );
      }
      .bg-gradient-subtle-orange {
        background: linear-gradient(
          135deg,
          #ffffff 0%,
          rgba(255, 122, 0, 0.03) 100%
        );
      }

      /* Smooth transitions */
      * {
        transition-property:
          color, background-color, border-color, text-decoration-color, fill,
          stroke, opacity, box-shadow, transform, filter, backdrop-filter;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        transition-duration: 200ms;
      }

      /* Print styles */
      @media print {
        @page {
          size: landscape;
          margin: 1cm;
        }
        body {
          background-color: white !important;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
      }

      /* Custom scrollbar styles */
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(156, 163, 175, 0.45) transparent;
      }

      /* WebKit Scrollbar styling (Chrome, Safari, newer Edge) */
      ::-webkit-scrollbar {
        width: 5px !important;
        height: 5px !important;
      }

      ::-webkit-scrollbar-track {
        background: transparent !important;
        margin: 8px 4px !important; /* Space at start and end of scrollbar to preserve curves */
      }

      ::-webkit-scrollbar-thumb {
        background-color: rgba(156, 163, 175, 0.45) !important;
        border-radius: 9999px !important;
        border: 1px solid transparent !important;
        background-clip: padding-box !important;
      }

      ::-webkit-scrollbar-thumb:hover {
        background-color: rgba(156, 163, 175, 0.7) !important;
      }

      /* Remove scrollbar arrow buttons (triangles) */
      ::-webkit-scrollbar-button,
      ::-webkit-scrollbar-button:single-button,
      ::-webkit-scrollbar-button:start,
      ::-webkit-scrollbar-button:end,
      ::-webkit-scrollbar-button:vertical,
      ::-webkit-scrollbar-button:horizontal,
      ::-webkit-scrollbar-button:decrement,
      ::-webkit-scrollbar-button:increment {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
      }

      /* Support for scrollbar hiding */
      .scrollbar-hide::-webkit-scrollbar,
      .no-scrollbar::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
      }
      .scrollbar-hide,
      .no-scrollbar {
        -ms-overflow-style: none !important;  /* IE and Edge */
        scrollbar-width: none !important;  /* Firefox */
      }
